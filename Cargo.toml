[workspace]
resolver = "3"
members = [
    "crates/graph-core",
    "crates/graph-sources",
    "crates/graph-render",
    "crates/graph-term",
    "crates/graph-gui",
    "crates/graph-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
graph-core = { path = "crates/graph-core" }
graph-sources = { path = "crates/graph-sources" }
graph-render = { path = "crates/graph-render" }
graph-term = { path = "crates/graph-term" }
graph-gui = { path = "crates/graph-gui" }

anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive"] }
crossterm = "0.29.0"
fontdue = "0.9.5"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
toml = "1.2.2"

[profile.dev.package."*"]
# Dependencies (rasterizer, png) are painfully slow unoptimized.
opt-level = 2
